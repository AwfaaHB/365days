<!DOCTYPE html>
<html>

<head>

    <title>Our Little Secret ❤️</title>

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <style>

        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #080808;

            color: white;

            font-family: Georgia, serif;

            text-align: center;
        }

        .box {
            width: 85%;
            max-width: 400px;

            padding: 40px 25px;

            background: #111;

            border: 1px solid #8b0015;

            border-radius: 15px;

            box-shadow:
            0 0 25px rgba(255,0,40,0.25);
        }

        h1 {
            color: #e6002d;
        }

        p {
            color: #bbb;

            line-height: 1.6;
        }

        input {
            width: 90%;

            padding: 12px;

            margin-top: 15px;

            background: #050505;

            color: white;

            border: 1px solid #8b0015;

            border-radius: 8px;

            text-align: center;

            font-size: 16px;
        }

        button {
            margin-top: 15px;

            padding: 12px 25px;

            background: #b00024;

            color: white;

            border: none;

            border-radius: 20px;

            cursor: pointer;

            font-size: 16px;
        }

        button:hover {
            background: #e6002d;
        }

        #error {
            display: none;

            color: #ff526d;

            margin-top: 15px;
        }

    </style>

</head>


<body>


<div class="box">

    <div style="font-size:50px;">
        ❤️
    </div>

    <h1>
        A Little Secret
    </h1>

    <p>
        There's something waiting
        for you inside.
    </p>

    <p>
        Enter the password to continue.
    </p>


    <input
        type="password"
        id="password"
        placeholder="Password"
    >


    <br>


    <button onclick="checkPassword()">
        Open ❤️
    </button>


    <p id="error">
        Wrong password 😭
    </p>

</div>


<script>

function checkPassword() {

    const password =
    document.getElementById("password").value;

    if (password === "19092025") {

        window.location.href =
        "anniversary.html";

    }

    else {

        document.getElementById("error")
        .style.display = "block";

    }

}

</script>


</body>

</html>
